[project]
name = "bg-transcriber"
version = "0.1.0"
description = "Speaker-labelled Bulgarian transcription with subtitles."
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal",
    "numpy>=2.5.4",
    "pyloudnorm>=0.2.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "spylls>=0.1.7",
]
