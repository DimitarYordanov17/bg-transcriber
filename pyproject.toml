[project]
name = "bg-transcriber"
version = "0.1.0"
description = "Multi-speaker Bulgarian transcription: open-source pipeline benchmarked against commercial STT."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
bgt = "bgt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgt"]
